<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="index.css" />
    <title>Chowdhury Tasnuva Portfolio</title>
  </head>

  <body>
    <!-- Star background -->
    <div class="star-field"></div>

    <nav class="topnav">
      <a href="index.html" class="nav-link brand">
        Portfolio of Tasnuva Chowdhury
      </a>

      <ul>
        <li><a href="projects.html" class="nav-link">Projects</a></li>
        <li><a href="contact.html" class="nav-link">Contact Me</a></li>
      </ul>
    </nav>

    <div class="heading">
      <div>
        <h1 class="hello">Hello!</h1>
        <p class="blurb">
          Welcome to my portfolio website. Scroll down to learn more about me.
        </p>
      </div>
    </div>

    <script>
      const starField = document.querySelector(".star-field");
      const numberOfStars = 120;
      const stars = [];

      let mouseX = -9999;
      let mouseY = -9999;

      for (let i = 0; i < numberOfStars; i++) {
        const star = document.createElement("div");
        star.classList.add("star");

        const size = Math.random() * 3 + 2;

        const starData = {
          element: star,
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          size: size,
          speedX: (Math.random() - 0.5) * 0.35,
          speedY: (Math.random() - 0.5) * 0.35,
        };

        star.style.width = size + "px";
        star.style.height = size + "px";

        starField.appendChild(star);
        stars.push(starData);
      }

      document.addEventListener("mousemove", (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      document.addEventListener("mouseleave", () => {
        mouseX = -9999;
        mouseY = -9999;
      });

      function animateStars() {
        stars.forEach((star) => {
          const dx = star.x - mouseX;
          const dy = star.y - mouseY;
          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < 120) {
            const force = (120 - distance) / 120;
            const angle = Math.atan2(dy, dx);

            star.x += Math.cos(angle) * force * 4;
            star.y += Math.sin(angle) * force * 4;
          }

          star.x += star.speedX;
          star.y += star.speedY;

          if (star.x < 0) star.x = window.innerWidth;
          if (star.x > window.innerWidth) star.x = 0;
          if (star.y < 0) star.y = window.innerHeight;
          if (star.y > window.innerHeight) star.y = 0;

          star.element.style.transform = `translate(${star.x}px, ${star.y}px)`;
        });

        requestAnimationFrame(animateStars);
      }

      animateStars();

      window.addEventListener("resize", () => {
        stars.forEach((star) => {
          star.x = Math.random() * window.innerWidth;
          star.y = Math.random() * window.innerHeight;
        });
      });
    </script>
  </body>
</html>
